name: mufarrigh
description: "مُفرِّغ — Sprite Sheet Extractor"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Pure-Dart image processing (approved, no native build step / no OpenCV)
  image: ^4.2.0

  # File & folder picking
  file_picker: ^8.1.0

  # State management
  provider: ^6.1.2

  # Paths & storage
  path_provider: ^2.1.5
  path: ^1.9.1

  # Desktop drag-and-drop
  desktop_drop: ^0.5.0

  # Color picker widget
  flutter_colorpicker: ^1.1.0

  # Persistent settings
  shared_preferences: ^2.3.3

  # Internationalization
  intl: ^0.20.2

  # Cupertino icons
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true          # enables flutter gen-l10n (ARB → Dart)
  uses-material-design: true
  assets:
    - assets/images/
